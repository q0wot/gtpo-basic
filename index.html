<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>GTPO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F1729" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="src/styles.css?v=825c804515" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <script defer src="src/main.js?v=9c4afb8549"></script>
</head>
<body>
<div class="nebula" aria-hidden="true"></div>
<canvas class="sky" data-sky aria-hidden="true"></canvas>
<div class="app">
    <header class="topbar">
        <img class="topbar__logo" src="src/assets/logo.svg" alt="GTPO" />
        <span class="tier-chip" data-tier-chip></span>
        <button class="lang-btn" type="button" data-lang-btn aria-haspopup="menu" aria-expanded="false" aria-label="Language">
            <span class="flag" data-lang-btn-flag></span>
            <span data-lang-btn-code>RU</span>
            <svg class="lang-btn__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </button>
    </header>
    <div class="lang-backdrop" data-lang-backdrop hidden></div>
    <div class="lang-menu" data-lang-menu role="menu" hidden></div>

    <main class="views">
        <!-- ============ Главная ============ -->
        <section class="view is-active" data-view="home" aria-labelledby="home-title">
            <h1 class="hello" id="home-title" data-hello></h1>

            <section class="calc" aria-labelledby="calc-title">
                <div class="calc__head">
                    <h2 class="block-title" id="calc-title" data-i18n="calc.title"></h2>
                    <span class="hint" data-i18n="calc.hint"></span>
                </div>
                <label class="calc__field">
                    <span class="calc__label" data-i18n="calc.deposit"></span>
                    <span class="calc__input">
                        <span aria-hidden="true">$</span>
                        <input type="text" inputmode="decimal" autocomplete="off" data-calc-deposit placeholder="100" />
                    </span>
                </label>
                <div class="calc__risk" role="radiogroup" data-calc-risk></div>
                <div class="calc__result">
                    <div>
                        <span class="calc__res-label" data-i18n="calc.stake"></span>
                        <span class="calc__res-value" data-calc-stake>—</span>
                    </div>
                    <p class="calc__note" data-calc-note></p>
                </div>
            </section>

            <section class="block">
                <div class="block__head">
                    <h2 class="block-title" data-i18n="market.title"></h2>
                    <button class="link-btn" type="button" data-market-toggle></button>
                </div>
                <ul class="market" data-market></ul>
                <p class="source" data-market-source></p>
            </section>

            <section class="block">
                <h2 class="block-title" data-i18n="faq.title"></h2>
                <div class="faq" data-faq></div>
            </section>

            <p class="risk" data-i18n="common.risk"></p>
        </section>

        <!-- ============ Сигнал ============ -->
        <section class="view" data-view="signal" aria-labelledby="signal-title">
            <div class="sig-head">
                <div>
                    <h1 class="view-title" id="signal-title" data-i18n="signal.title"></h1>
                    <p class="clock"><span data-i18n="signal.yourTime"></span> <b data-clock>--:--</b></p>
                </div>
                <span class="status" data-status hidden><i></i><span data-status-text></span></span>
            </div>

            <button class="broker-btn" type="button" data-broker>
                <span class="broker-btn__logo" aria-hidden="true"></span>
                <span class="broker-btn__text">
                    <b>Pocket Option</b>
                    <span data-i18n="signal.brokerSub"></span>
                </span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </button>

            <div class="recent" data-recent hidden>
                <span class="recent__label" data-i18n="signal.recent"></span>
                <div class="chips" data-recent-chips></div>
            </div>

            <div class="pick-list">
                <button class="pick-row" type="button" data-pick="pair">
                    <span class="pick-row__title" data-i18n="signal.pair"></span>
                    <span class="pick-row__value" data-pick-value></span>
                    <svg class="panel__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
                <button class="pick-row" type="button" data-pick="time">
                    <span class="pick-row__title" data-i18n="signal.expiry"></span>
                    <span class="pick-row__value" data-pick-value></span>
                    <svg class="panel__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
                <button class="pick-row" type="button" data-pick="mode">
                    <span class="pick-row__title" data-i18n="signal.mode"></span>
                    <span class="pick-row__value" data-pick-value></span>
                    <svg class="panel__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
            </div>

            <p class="market-warn" data-market-warn hidden></p>

            <div class="cta-bar">
                <button class="primary-btn" type="button" data-get-signal disabled data-i18n="signal.get"></button>
            </div>
        </section>


        <!-- ============ Лидерборд (превью до запуска рейтинга) ============ -->
        <section class="view" data-view="top" aria-labelledby="top-title">
            <div class="top-head">
                <h1 class="view-title" id="top-title" data-i18n="top.title"></h1>
                <span class="demo-chip" data-top-demo hidden data-i18n="top.demo"></span>
            </div>
            <div class="segmented" role="tablist" data-top-period hidden>
                <button type="button" role="tab" data-period="week" class="is-active" data-i18n="top.week"></button>
                <button type="button" role="tab" data-period="month" data-i18n="top.month"></button>
                <button type="button" role="tab" data-period="all" data-i18n="top.all"></button>
            </div>
            <p class="reset-note" data-top-reset hidden></p>


            <div class="podium" data-podium></div>
            <ol class="lb" data-lb></ol>

            <div class="lb-me" data-lb-me>
                <span class="lb-rank" data-lb-me-rank>—</span>
                <span class="avatar avatar--me" data-lb-me-avatar></span>
                <span class="lb-me__name">
                    <span data-lb-me-name></span>
                    <span class="lb-me__sub" data-lb-me-sub></span>
                </span>
                <span class="lb-me__tag" data-i18n="top.you"></span>
            </div>
        </section>
    </main>

    <nav class="tabbar" aria-label="Navigation">
        <button class="tab" type="button" data-tab="top">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M8 20h8M16 6h3v2a3 3 0 0 1-3 3M8 6H5v2a3 3 0 0 0 3 3"/></svg>
            <span data-i18n="tabs.top"></span>
        </button>
        <button class="tab is-active" type="button" data-tab="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
            <span data-i18n="tabs.home"></span>
        </button>
        <button class="tab tab--main" type="button" data-tab="signal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l5-5 4 4 7-7M15 8h5v5"/></svg>
            <span data-i18n="tabs.signal"></span>
        </button>
    </nav>

    <!-- Окно выбора: инструмент / экспирация / режим -->
    <div class="sheet sheet--center sheet--picker" data-picker aria-hidden="true">
        <div class="sheet__backdrop" data-close></div>
        <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="picker-title">
            <button class="sheet__close" type="button" data-close aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <h2 class="sheet__title" id="picker-title" data-picker-title></h2>

            <div class="pick-body" data-pick-body="pair">
                <label class="mini-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
                    <input type="search" data-pair-search autocomplete="off" />
                </label>
                <div class="cat-row" data-cat-row></div>
                <div class="pair-grid" data-pair-grid></div>
            </div>
            <div class="pick-body" data-pick-body="time" hidden>
                <div class="exp-grid" data-exp-grid></div>
            </div>
            <div class="pick-body" data-pick-body="mode" hidden>
                <div class="mode-grid" data-mode-grid></div>
            </div>
        </div>
    </div>

    <!-- Лист сигнала -->
    <div class="sheet sheet--center" data-signal-sheet aria-hidden="true">
        <div class="sheet__backdrop" data-close></div>
        <div class="sheet__panel sheet__panel--signal" role="dialog" aria-modal="true" aria-labelledby="sig-pair">
            <button class="sheet__close" type="button" data-close aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>

            <div class="sig-loading" data-sig-loading>
                <h2 class="sig-loading__title" data-i18n="signal.generating"></h2>
                <p class="sig-loading__pair" data-sig-loading-pair></p>
                <ol class="steps" data-sig-steps></ol>
                <div class="steps-bar" aria-hidden="true"><span data-sig-steps-bar></span></div>
            </div>

            <div class="sig" data-sig hidden>
                <span class="demo-tag" data-i18n="signal.demoTag"></span>
                <div class="sig__dir" data-sig-dir>
                    <div class="sig__orb" aria-hidden="true">
                        <span class="sig__ring"></span>
                        <span class="sig__ring sig__ring--2"></span>
                        <svg viewBox="0 0 64 64"><path pathLength="100" d="M32 54V10M14 28l18-18 18 18"/></svg>
                    </div>
                    <span class="sig__word" data-sig-dir-text></span>
                </div>
                <h2 class="sig__pair" id="sig-pair" data-sig-pair></h2>
                <figure class="sig-chart" data-sig-chart hidden>
                    <svg viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true">
                        <defs>
                            <linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="currentColor" stop-opacity="0.28"/>
                                <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        <path class="sig-chart__area" data-chart-area d=""/>
                        <path class="sig-chart__line" data-chart-line d=""/>
                    </svg>
                    <figcaption data-chart-caption></figcaption>
                </figure>
                <dl class="sig__meta">
                    <div><dt data-i18n="signal.expiry"></dt><dd data-sig-expiry></dd></div>
                    <div><dt data-i18n="signal.issued"></dt><dd data-sig-issued></dd></div>
                    <div><dt data-i18n="signal.left"></dt><dd data-sig-left></dd></div>
                </dl>
                <div class="sig-timebar" aria-hidden="true"><span data-sig-timebar></span></div>
                <p class="sig-expired" data-sig-expired hidden></p>
                <button type="button" class="primary-btn" data-sig-again data-i18n="signal.again"></button>
            </div>
        </div>
    </div>

    <div class="toast" data-toast role="status" aria-live="polite"></div>
</div>
</body>
</html>
