<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>GTPO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F1729" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="src/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <script defer src="src/main.js"></script>
</head>
<body>
<div class="app">
    <header class="topbar">
        <img class="topbar__logo" src="src/assets/logo.svg" alt="GTPO" />
        <span class="tier-chip" data-tier-chip></span>
        <button class="lang-btn" type="button" data-lang-btn aria-label="Language">RU</button>
    </header>

    <main class="views">
        <!-- ============ Главная ============ -->
        <section class="view is-active" data-view="home" aria-labelledby="home-title">
            <h1 class="hello" id="home-title" data-hello></h1>

            <article class="stats-card" data-stats-card>
                <div class="stats-card__head">
                    <h2 class="block-title" data-i18n="home.myStats"></h2>
                    <span class="hint" data-i18n="home.selfReported"></span>
                </div>
                <div class="stats-row" data-stats-row></div>
                <div class="winbar" aria-hidden="true"><span data-winbar></span></div>
                <p class="empty" data-stats-empty hidden>
                    <span data-i18n="home.statsEmpty"></span>
                    <button class="link-btn" type="button" data-goto="signal" data-i18n="home.toSignal"></button>
                </p>
            </article>

            <section class="block">
                <div class="block__head">
                    <h2 class="block-title" data-i18n="market.title"></h2>
                    <button class="link-btn" type="button" data-market-toggle></button>
                </div>
                <ul class="market" data-market></ul>
                <p class="source" data-market-source></p>
            </section>

            <section class="block">
                <h2 class="block-title" data-i18n="faq.title"></h2>
                <div class="faq" data-faq></div>
            </section>

            <p class="risk" data-i18n="common.risk"></p>
        </section>

        <!-- ============ Сигнал ============ -->
        <section class="view" data-view="signal" aria-labelledby="signal-title">
            <h1 class="view-title" id="signal-title" data-i18n="signal.title"></h1>
            <p class="view-lead" data-i18n="signal.lead"></p>

            <div class="form">
                <button class="field" type="button" data-field="pair">
                    <span class="field__label" data-i18n="signal.pair"></span>
                    <span class="field__value" data-field-value></span>
                    <svg class="field__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
                <button class="field" type="button" data-field="time">
                    <span class="field__label" data-i18n="signal.expiry"></span>
                    <span class="field__value" data-field-value></span>
                    <svg class="field__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
                <button class="field" type="button" data-field="mode">
                    <span class="field__label" data-i18n="signal.mode"></span>
                    <span class="field__value" data-field-value></span>
                    <svg class="field__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </button>
            </div>

            <button class="primary-btn" type="button" data-get-signal disabled data-i18n="signal.get"></button>
            <p class="demo-note" data-i18n="signal.demoNote"></p>
        </section>

        <!-- ============ Журнал ============ -->
        <section class="view" data-view="journal" aria-labelledby="journal-title">
            <h1 class="view-title" id="journal-title" data-i18n="journal.title"></h1>
            <p class="view-lead" data-i18n="journal.lead"></p>
            <div class="stats-row stats-row--compact" data-journal-stats></div>
            <ul class="journal" data-journal></ul>
            <p class="empty" data-journal-empty hidden>
                <span data-i18n="journal.empty"></span>
                <button class="link-btn" type="button" data-goto="signal" data-i18n="home.toSignal"></button>
            </p>
            <button class="ghost-btn" type="button" data-journal-clear data-i18n="journal.clear" hidden></button>
        </section>

        <!-- ============ TOP ============ -->
        <section class="view" data-view="top" aria-labelledby="top-title">
            <h1 class="view-title" id="top-title" data-i18n="top.title"></h1>
            <p class="view-lead" data-top-lead></p>
            <div class="segmented" role="tablist" data-top-period>
                <button type="button" role="tab" data-period="week" class="is-active" data-i18n="top.week"></button>
                <button type="button" role="tab" data-period="month" data-i18n="top.month"></button>
                <button type="button" role="tab" data-period="all" data-i18n="top.all"></button>
            </div>
            <ol class="board" data-board></ol>
            <div class="board-me" data-board-me hidden></div>
            <p class="empty" data-board-empty hidden></p>
        </section>
    </main>

    <nav class="tabbar" aria-label="Navigation">
        <button class="tab is-active" type="button" data-tab="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
            <span data-i18n="tabs.home"></span>
        </button>
        <button class="tab tab--main" type="button" data-tab="signal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l5-5 4 4 7-7M15 8h5v5"/></svg>
            <span data-i18n="tabs.signal"></span>
        </button>
        <button class="tab" type="button" data-tab="journal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h3"/></svg>
            <span data-i18n="tabs.journal"></span>
        </button>
        <button class="tab" type="button" data-tab="top">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M8 20h8M16 6h3v2a3 3 0 0 1-3 3M8 6H5v2a3 3 0 0 0 3 3"/></svg>
            <span data-i18n="tabs.top"></span>
        </button>
    </nav>

    <!-- Нижний лист выбора -->
    <div class="sheet" data-picker aria-hidden="true">
        <div class="sheet__backdrop" data-close></div>
        <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="picker-title">
            <div class="sheet__grip" data-close></div>
            <h2 class="sheet__title" id="picker-title" data-picker-title></h2>
            <div class="picker-tools" data-picker-tools>
                <div class="tabs-row" data-picker-cats></div>
                <label class="search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
                    <input type="search" data-picker-search autocomplete="off" />
                </label>
                <button class="fav-filter" type="button" data-fav-filter aria-pressed="false">★</button>
            </div>
            <ul class="options" data-picker-list></ul>
        </div>
    </div>

    <!-- Лист сигнала -->
    <div class="sheet" data-signal-sheet aria-hidden="true">
        <div class="sheet__backdrop" data-close></div>
        <div class="sheet__panel sheet__panel--signal" role="dialog" aria-modal="true" aria-labelledby="sig-pair">
            <div class="sheet__grip" data-close></div>

            <div class="sig-loading" data-sig-loading>
                <div class="sig-loading__ring"></div>
                <p data-i18n="signal.generating"></p>
            </div>

            <div class="sig" data-sig hidden>
                <span class="demo-tag" data-i18n="signal.demoTag"></span>
                <div class="sig__dir" data-sig-dir>
                    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 10v44M14 28l18-18 18 18"/></svg>
                    <span data-sig-dir-text></span>
                </div>
                <h2 class="sig__pair" id="sig-pair" data-sig-pair></h2>
                <dl class="sig__meta">
                    <div><dt data-i18n="signal.expiry"></dt><dd data-sig-expiry></dd></div>
                    <div><dt data-i18n="signal.issued"></dt><dd data-sig-issued></dd></div>
                    <div><dt data-i18n="signal.left"></dt><dd data-sig-left></dd></div>
                </dl>
                <p class="sig__ask" data-i18n="signal.askResult"></p>
                <div class="sig__result">
                    <button type="button" class="res-btn res-btn--win" data-result="win" data-i18n="signal.win"></button>
                    <button type="button" class="res-btn res-btn--loss" data-result="loss" data-i18n="signal.loss"></button>
                </div>
                <p class="sig__saved" data-sig-saved hidden></p>
                <button type="button" class="ghost-btn" data-sig-again data-i18n="signal.again"></button>
            </div>
        </div>
    </div>

    <div class="toast" data-toast role="status" aria-live="polite"></div>
</div>
</body>
</html>
